<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
<section>
    <div id="register">
        <h1 style="text-align: center;">
            <i class="fa-brands fa-spotify"></i>
            Spotify</h1>
        <h2 style="text-align: center;">registrati per sentire milioni di canzoni completamente gratis</h2>
        <div style="display: flex; justify-content: center;">
            <div class="provider">
                <button class="buttonloginfacebook">
                    <i class="fa-brands fa-facebook"></i>
                    Registrati con facebook </button>
                <button class="buttonloginVerde">
                    <i class="fa-brands fa-google"></i>
                    Registrati con google 
                </button>
            </div>
        </div>
        <div class="container">
            <form action="">
                <input class="inputForm" placeholder="nome" type="text" name="name" id="name">
                <input class="inputForm"  placeholder="email" type="email" name="email" id="email">
                <input class="inputForm" placeholder="password" type="password" name="password" id="password">
                <input class="inputForm" type="date" name="date" id="date">
                <input class="inputForm" placeholder="Numero di telefono" type="number" name="phone" id="phone">
        
                <p>Scegli il tuo stile</p>
                <div>
                    <input name="Rock" id="Rock" type="checkbox" name="" id="">
                    <label for="Rock">Rock</label>
                </div>
                <div>
                    <input type="checkbox" name="Jazz" id="Jazz">
                    <label for="Jazz">Jazz</label>
                </div>
                <div>
                    <input type="checkbox" name="Elettronica" id="Elettronica">
                    <label for="Elettronica">Musica Elettronica</label>
                </div>
                <hr>
                <span>Dichiaro di aver letto e compreso la Privacy Policy e accetto i Termini e Condizioni del servizio. </span>
                <div>
                    <input value="si" type="radio" name="Policy" id="si">
                    <label for="si">si</label>
                    <input value="no" type="radio" name="Policy" id="no">
                    <label for="no">no</label>
                </div>
                <button type="submit">Join Spotify</button>
                <button style="background-color: transparent; border: 0;">Login</button>
            </form>
        </div>
    </div>
</section>

</body>
</html>
